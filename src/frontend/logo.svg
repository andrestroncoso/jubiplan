<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- J Letter with Arrow Inside -->
  <g filter="url(#glow)">
    <!-- Left vertical line of J -->
    <rect x="20" y="15" width="8" height="85" fill="url(#arrowGradient)" rx="4"/>

    <!-- Bottom hook of J -->
    <path d="M 28 100 Q 28 115 15 115" stroke="url(#arrowGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Arrow shaft (inside the J) -->
    <rect x="35" y="35" width="6" height="70" fill="url(#arrowGradient)" rx="3"/>

    <!-- Arrow head - top triangle -->
    <polygon points="45,35 35,52 45,52 55,35" fill="url(#arrowGradient)"/>

    <!-- Right accent line for visual balance -->
    <rect x="65" y="25" width="6" height="50" fill="url(#arrowGradient)" opacity="0.6" rx="3"/>
  </g>

  <!-- Optional: Currency symbol accent -->
  <text x="60" y="120" font-size="16" fill="url(#arrowGradient)" font-weight="bold" text-anchor="middle" filter="url(#glow)">€</text>
</svg>